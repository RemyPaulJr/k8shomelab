apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/RemyPaulJr/k8shomelab.git
    targetRevision: main
    path: kubernetes/infrastructure/ingress
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
